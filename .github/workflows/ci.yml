name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare test data
        run: |
          mkdir -p data/raw
          echo "id,nome,email,cidade,estado,data_cadastro" > data/raw/customers.csv
          for i in $(seq 1 1000); do echo "$i,Name$i,email$i@example.com,City,ST,2025-01-01" >> data/raw/customers.csv; done
      - name: Run tests
        run: python -m pytest -q

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          push: false
          tags: etl:latest
